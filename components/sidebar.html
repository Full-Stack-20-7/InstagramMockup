<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Instagram‐style Sidebar</title>
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>

  <!-- 토글 버튼 (열기/닫기) -->
  <button id="sidebarToggle" aria-label="Toggle sidebar">
    ☰
  </button>

  <!-- 사이드바 -->
  <nav class="sidebar">
    <ul>
      <li><a href="#"><img src="../assets/logo.svg" alt="Instagram"></a></li>
      <li><a href="#"><img src="../assets/home.svg"      alt="Home"></a></li>
      <li><a href="#"><img src="../assets/reels.svg"     alt="Reels"></a></li>
      <li>
        <a href="#">
          <img src="../assets/dm.svg" alt="Messages">
          <span class="badge"></span>
        </a>
      </li>
      <li><a href="#"><img src="../assets/search.svg"    alt="Search"></a></li>
      <li><a href="#"><img src="../assets/explore.svg"   alt="Explore"></a></li>
      <li><a href="#"><img src="../assets/like.svg"     alt="Likes"></a></li>
      <li><a href="#"><img src="../assets/plus.svg"   alt="New Post"></a></li>
    
     
    </ul>
  </nav>

  <!-- 메인 콘텐츠 -->
  <main class="content">
    <h1></h1>
    <!-- … -->
  </main>

  <!-- 오른쪽 사이드바 (추천 영역) -->
  <aside class="sidebar">
    <!-- 1. 내 프로필 영역 -->
    <div class="profile">
      <img src="assets/my-avatar.jpg" alt="My Avatar" class="profile__avatar" />
      <div class="profile__info">
        <strong>my_username</strong>
        <span>My Name</span>
      </div>
    </div>

    <!-- 2. 추천 친구 영역 -->
    <div class="suggestions">
      <div class="suggestions__header">
        <span>추천 계정</span>
        <a href="#">모두 보기</a>
      </div>
      <ul class="suggestions__list">
        <!-- 더미 데이터 반복 -->
        <li class="suggestion-item">
          <img src="assets/user1.jpg" alt="" class="suggestion-item__avatar" />
          <div class="suggestion-item__info">
            <strong>user1</strong>
            <span>팔로우 중</span>
          </div>
          <button class="follow-btn">팔로우</button>
        </li>
        <!-- 나머지도 반복 -->
      </ul>
    </div>

    <!-- 3. 푸터 링크 영역 -->
    <footer class="sidebar__footer">
      <a href="#">소개</a>
      <a href="#">도움말</a>
      <a href="#">개발자</a>
      <span>© 2024 INSTAGRAM FROM META</span>
    </footer>
  </aside>

  <script src="sidebar.js"></script>
</body>
</html>
