<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/storynfeed.css">
</head>
<body>
    <main class="storynfeed-section">
  <div class="stories-container">
    <div class="story-item">
      <div class="story-avatar">
        <img src="https://picsum.photos/150/150?random=1" alt="user1">
      </div>
      <span class="story-username">user1</span>
    </div>

    <div class="story-item">
      <div class="story-avatar">
        <img src="https://picsum.photos/150/150?random=2" alt="user2">
      </div>
      <span class="story-username">user2</span>
    </div>

    <div class="story-item">
      <div class="story-avatar">
        <img src="https://picsum.photos/150/150?random=3" alt="user3">
      </div>
      <span class="story-username">user3</span>
    </div>

    <div class="story-item">
      <div class="story-avatar">
        <img src="https://picsum.photos/150/150?random=4" alt="user4">
      </div>
      <span class="story-username">user4</span>
    </div>

    <div class="story-item">
      <div class="story-avatar">
        <img src="https://picsum.photos/150/150?random=5" alt="user5">
      </div>
      <span class="story-username">user5</span>
    </div>

    <div class="story-item">
      <div class="story-avatar">
        <img src="https://picsum.photos/150/150?random=6" alt="user6">
      </div>
      <span class="story-username">user6</span>
    </div>
  </div>

  <div class="posts-container">
    <article class="post">
      <div class="post-header">
        <div class="post-author">
          <img src="https://picsum.photos/150/150?random=11" alt="author1" class="author-avatar">
          <span class="author-name">traveler_jane</span>
        </div>
        <button class="post-options">
          <img src="../assets/more.svg" alt="more">
        </button>
      </div>

      <div class="post-image">
        <img src="https://picsum.photos/1080/1080?random=21" alt="post1">
      </div>

      <div class="post-actions">
        <div class="action-buttons-left">
            <button class="action-btn">
                <img src="../assets/heart.svg" alt="like">
            </button>
            <button class="action-btn">
                <img src="../assets/comment.svg" alt="comment">
            </button>
            <button class="action-btn">
                <img src="../assets/share.svg" alt="share">
            </button>
        </div>
        <div class="action-button-right">
            <button class="action-btn save-btn">
                <img src="../assets/save.svg" alt="save">
            </button>
        </div>
      </div>

      <div class="post-info">
        <div class="post-likes">좋아요 1,234개</div>
        <div class="post-caption">
          <span class="caption-author">traveler_jane</span>
          <span class="caption-text">Beautiful sunset at the beach 🌅</span>
        </div>
        <div class="post-time">2시간 전</div>
      </div>
    </article>

    <article class="post">

      </div>

      <div class="post-actions">
        <div class="action-buttons-left">
          <button class="action-btn">

        <div class="action-button-right">

                <img src="../assets/save.svg" alt="save">
            </button>
        </div>
      </div>

      <div class="post-info">
        <div class="post-likes">좋아요 856개</div>
        <div class="post-caption">
          <span class="caption-author">foodie_mark</span>
          <span class="caption-text">Homemade pasta for dinner tonight! 🍝</span>
        </div>
        <div class="post-time">5시간 전</div>
      </div>
    </article>

    <article class="post">
      <div class="post-header">
        <div class="post-author">
          <img src="https://picsum.photos/150/150?random=13" alt="author3" class="author-avatar">

        </div>

        </div>
        <div class="action-button-right">
            <button class="action-btn save-btn">

            </button>
        </div>
      </div>

      <div class="post-info">
        <div class="post-likes">좋아요 2,091개</div>
        <div class="post-caption">
          <span class="caption-author">fitness_alex</span>
          <span class="caption-text">Morning workout complete! 💪 #fitness #motivation</span>
        </div>
        <div class="post-time">8시간 전</div>
      </div>
    </article>
  </div>
</main>
<script src="../script.js"></script>
</body>
</html>
